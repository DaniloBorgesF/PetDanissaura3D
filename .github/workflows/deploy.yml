# Nome do workflow
name: Deploy para GitHub Pages

# Trigger: roda quando há push na branch main
on:
  push:
    branches:
      - main  # ou master, dependendo da sua branch principal
  workflow_dispatch:  # permite rodar manualmente

# Permissões necessárias para deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job de build
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
      
      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Instalar dependências
        run: npm ci
      
      - name: 🔍 Verificar TypeScript
        run: npm run typecheck
        continue-on-error: true  # não falha o build se houver erros de tipo
      
      - name: 🏗️ Build do projeto
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: 📤 Upload do artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Job de deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 🚀 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
